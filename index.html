<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Попутчица — интерактивная новелла</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-location="street">

  <!-- Титульный экран -->
  <div id="title-screen" class="screen active">
    <h1>ПОПУТЧИЦА</h1>
    <p class="subtitle">интерактивная новелла</p>
    <input type="text" id="player-name" placeholder="Введи своё имя..." maxlength="16">
    <button id="start-btn">Начать историю</button>
  </div>

  <!-- Игровой экран -->
  <div id="game-screen" class="screen">
    <div id="hud">
      <span id="hud-name"></span>
      <span id="hud-trust">Доверие: <b id="trust-value">0</b></span>
    </div>

    <div id="bg-layer"></div>

    <div id="chars">
      <img id="char-girl"   src="char_girl.png"   alt="" onerror="this.style.display='none'">
      <img id="char-cat"    src="char_cat.png"    alt="" onerror="this.style.display='none'">
      <img id="char-seller" src="char_seller.png" alt="" onerror="this.style.display='none'">
    </div>

    <div id="dialogue-box">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
      <div id="choices"></div>
      <div id="next-hint">▼ нажми, чтобы продолжить</div>
    </div>

    <div id="trust-popup"></div>
  </div>

  <!-- Экран концовки -->
  <div id="ending-screen" class="screen">
    <h2 id="ending-title"></h2>
    <p id="ending-text"></p>
    <p id="ending-score"></p>
    <button id="restart-btn">Пройти заново</button>
  </div>

<script src="script.js"></script>
</body>
</html>
